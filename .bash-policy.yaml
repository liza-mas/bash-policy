rules:
  # Runtime command-shape rules accepted from dry-run evidence.
  - kind: command-shape
    identity: git --no-pager diff --cached --no-color <safe-path>
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff --no-color
    decision: allow
  - kind: command-shape
    identity: git --no-pager diff <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git check-ignore -v  <safe-path>
    decision: allow
  - kind: command-shape
    identity: git diff --cached <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git diff <safe-path>...
    decision: allow
  - kind: command-shape
    identity: git log --oneline -<number>
    decision: allow
  - kind: command-shape
    identity: git ls-files --others --exclude-standard
    decision: allow
  - kind: command-shape
    identity: git status --porcelain <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -A<number> -B<number> <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -E <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -iE <pattern>
    decision: allow
  - kind: command-shape
    identity: grep -nE -i <pattern> <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -rn <pattern> --include=*.go .
    decision: allow
  - kind: command-shape
    identity: grep -rn <pattern> --include=*.go <safe-path>...
    decision: allow
  - kind: command-shape
    identity: grep -v <pattern>
    decision: allow
  - kind: command-shape
    identity: grep <pattern>
    decision: allow
  - kind: command-shape
    identity: head -<number>
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p
    decision: allow
  - kind: command-shape
    identity: nl -ba <safe-path>
    decision: allow
  - kind: command-shape
    identity: sed -n <number>,<number>p <safe-path>
    decision: allow
  - kind: command-shape
    identity: tail -<number>
    decision: allow
  - kind: command-shape
    identity: tail -n +<number>
    decision: allow
  - kind: command-shape
    identity: "true"
    decision: allow

  # Export-only bookkeeping for reviewed broad Claude Bash permission families.
  # These do not authorize runtime commands.
  - kind: permission-family
    identity: Bash(/usr/bin/test:*)
    status: resolved
  - kind: permission-family
    identity: Bash(ast-grep:*)
    status: resolved
  - kind: permission-family
    identity: Bash(awk:*)
    status: resolved
